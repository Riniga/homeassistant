title: Planritning
views:
  - title: Markplan
    path: markplan
    icon: mdi:floor-plan
    type: panel
    cards:
      - type: picture-elements
        image: /local/floorplan-ground.png
        elements:
          # Hall
          - type: state-icon
            entity: light.hall
            style:
              top: 69%
              left: 60%
              transform: translate(-50%, -50%) scale(0.6)
          - type: state-icon
            entity: light.hallampa
            style:
              top: 69%
              left: 64%
              transform: translate(-50%, -50%) scale(0.6)

          # Kontor
          - type: state-icon
            entity: light.kontor
            style:
              top: 68%
              left: 38%
              transform: translate(-50%, -50%) scale(0.6)
          - type: state-icon
            entity: light.kontor2
            style:
              top: 68%
              left: 43%
              transform: translate(-50%, -50%) scale(0.6)
          - type: state-icon
            entity: light.kontorslampa
            style:
              top: 68%
              left: 48%
              transform: translate(-50%, -50%) scale(0.6)

          # TV-Rum
          - type: state-icon
            entity: light.taklampa_2
            style:
              top: 13%
              left: 30%
              transform: translate(-50%, -50%) scale(0.6)

          # Utomhus
          - type: state-icon
            entity: light.ute
            style:
              top: 10%
              left: 70%
              transform: translate(-50%, -50%) scale(0.6)
          - type: state-icon
            entity: light.hue_ambiance_lamp_1
            style:
              top: 10%
              left: 75%
              transform: translate(-50%, -50%) scale(0.6)
          - type: state-icon
            entity: light.hue_ambiance_lamp_2
            style:
              top: 10%
              left: 80%
              transform: translate(-50%, -50%) scale(0.6)

          # Vardagsrum
          - type: state-icon
            entity: light.vagguttag_vardagsrum_inspelning
            style:
              top: 45%
              left: 75%
              transform: translate(-50%, -50%) scale(0.6)

          # Doors / windows

          # Groventre
          - type: state-icon
            entity: binary_sensor.groventre_dorr
            style:
              top: 70%
              left: 27%
              transform: translate(-50%, -50%) scale(0.6)

          # Hall (offset below the light icons to avoid overlap)
          - type: state-icon
            entity: binary_sensor.entre_oppning
            style:
              top: 73%
              left: 60%
              transform: translate(-50%, -50%) scale(0.6)
          - type: state-icon
            entity: binary_sensor.finentre_oppning
            style:
              top: 73%
              left: 64%
              transform: translate(-50%, -50%) scale(0.6)

          # Kok - cabinet door, not a room entry door
          - type: state-icon
            entity: binary_sensor.dorr_mediaskap_oppning
            style:
              top: 45%
              left: 42%
              transform: translate(-50%, -50%) scale(0.6)

          # TV-Rum (offset below the light icon)
          - type: state-icon
            entity: binary_sensor.altandorr_tv_rum_oppning
            style:
              top: 17%
              left: 30%
              transform: translate(-50%, -50%) scale(0.6)

          # Vardagsrum (offset below the light icon)
          - type: state-icon
            entity: binary_sensor.altandorr_vardagsrum_oppning
            style:
              top: 49%
              left: 75%
              transform: translate(-50%, -50%) scale(0.6)

          # Temperature / humidity badges

          # Hall (temperature only, no humidity sensor)
          - type: state-badge
            entity: sensor.hall_temperatur
            style:
              top: 77%
              left: 62%
              transform: translate(-50%, -50%) scale(0.6)

          # Sovrum
          - type: state-badge
            entity: sensor.sensor_sovrum_multisensor_temperatur
            style:
              top: 18%
              left: 11%
              transform: translate(-50%, -50%) scale(0.6)
          - type: state-badge
            entity: sensor.sensor_sovrum_multisensor_luftfuktighet
            style:
              top: 18%
              left: 15%
              transform: translate(-50%, -50%) scale(0.6)

          # TV-Rum
          - type: state-badge
            entity: sensor.tv_rum_temperatur
            style:
              top: 21%
              left: 28%
              transform: translate(-50%, -50%) scale(0.6)
          - type: state-badge
            entity: sensor.tv_rum_luftfuktighet
            style:
              top: 21%
              left: 32%
              transform: translate(-50%, -50%) scale(0.6)

          # Utomhus (widened and dropped further below the light row)
          - type: state-badge
            entity: sensor.utetemp_temperatur
            style:
              top: 18%
              left: 71%
              transform: translate(-50%, -50%) scale(0.6)
          - type: state-badge
            entity: sensor.utetemp_luftfuktighet
            style:
              top: 18%
              left: 79%
              transform: translate(-50%, -50%) scale(0.6)

          # Vardagsrum
          - type: state-badge
            entity: sensor.sensor_kontor_luftkvalitet_temperatur
            style:
              top: 53%
              left: 73%
              transform: translate(-50%, -50%) scale(0.6)
          - type: state-badge
            entity: sensor.sensor_kontor_luftkvalitet_luftfuktighet
            style:
              top: 53%
              left: 77%
              transform: translate(-50%, -50%) scale(0.6)
